name: josh_mina
description: Start in Ossex with Burrow and Climb. Repair all 6 generators to win. (No Radiant Manor.)
game: Mina The Hollower
requires:
  version: 0.6.7 # Version of Archipelago required for this yaml to work as expected.
  game:
    Mina The Hollower: 0.11.0 # Version of the world required for this yaml to work as expected.
Mina The Hollower:
  goal: fixgenerators
  goal_generators: 6

  # Logic
  ossex_start: 'true'
  kear_rando: apitems
  ability_rando:
    - Bounce
    #- Burrow
    - Carry
    #- Climb
    - Spring
    - Swim

  # Balance
  bone_up_cap: allupgrade
  max_stat_level: 15
  random_starting_items: 'false'

  death_link: 'false'
