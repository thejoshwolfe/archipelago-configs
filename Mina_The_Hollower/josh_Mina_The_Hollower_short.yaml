name: josh_mina
description: Start in Ossex with Burrow and Climb. Repair a randomly chosen 2/6 generators to win (check ossex fountain). Fishing excluded.
game: Mina The Hollower
requires:
  version: 0.6.7 # Version of Archipelago required for this yaml to work as expected.
  game:
    Mina The Hollower: 0.11.0 # Version of the world required for this yaml to work as expected.
Mina The Hollower:
  accessibility: minimal
  goal: fixgenerators
  goal_generators: 2
  generator_pool:
    - 'Queensbury Crypt'
    - "Nox's Bayou"
    - 'Septemburg'
    - 'Bone Beach'
    #- 'Coltrane Peak'
    #- 'Astral Orrery'

  starting_weapon:
    nightstar: 1
    blaststrike_maul: 1
    whisper_and_vesper: 1
    battery_buster: 0
    guardian_casket: 1

  # Logic
  kear_rando: areaapitems
  ability_rando:
    - Bounce
    #- Burrow
    - Carry
    #- Climb
    - Spring
    - Swim
  astral_switches: true

  exclude_locations:
    # No fishing.
    - AO Mirror's End Fish Trunkstar Core
    - BB Fish Goremaw Fang
    - BW Fish Fleeper Head
    #- BW Fishing Hole Thalassian Pearl
    - CTP Fish Fishcicle Core
    - EH Fish Dork Eyes
    - KW Fish Gazeworm Eye
    - LL Fish Trigger Antennae
    - NB Fish Shrimpter Tail
    - OS Fish Triple Flagellum
    - QC Fish Tombstone
    - SB Fish Spincer Pincers
    - SF Fish Puffer Beak
    - SO Fish Crumblefin Head
    - WW Fish Cuddlepus Shell
    - WW Fish Glomper Stalk
    - BW Fishing Hole Gilded Rod

  # Balance
  bone_up_cap: allupgrade
  max_stat_level: 15
  random_starting_items: 'false'

  # Traps
  trap_percent: 10
  disabled_traps:
    - Flip Controls Trap # Invert your controls
    - Floor Is Lava Trap # Leave a trail of lava
    - Giant Trap # Mina gets larger
    - 2x Giant Trap # Mina gets VERY large
    - Giant Enemies Trap # All enemies get larger
    - 2x Giant Enemies Trap # All enemies get VERY large
    - Invisible Trap # Mina becomes invisible
    - No HUD Trap # Remove your HUD
    - Rotate Camera Trap # Slowly rotate your camera for a short time
    - Rotate Camera Input Trap # Moving now rotates your camera slowly
    - Mirror Screen Trap # Mirror your screen
    - Upsidedown Screen Trap # Mirror your screen vertically

  death_link: 'false'
